[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helmet-detection"
version = "2.0.0"
description = "Real-time helmet-compliance detection with YOLO, ByteTrack, a desktop GUI and a web app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hammad Abrar Matto" }]
dependencies = [
    "ultralytics>=8.4.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "lap>=0.5.12",
]

[project.optional-dependencies]
web = ["streamlit>=1.50", "pandas>=2.0"]
export = ["onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
helmet-detect = "helmet_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
